system:
  timezone: "Asia/Kolkata"
  data_provider: "yfinance"
  retries: 3
  timeout_seconds: 10
  backoff_factor: 1.5

units:
  gold_oz_to_grams: 31.1034768
  gold_oz_to_10g_factor: 0.321507466
  silver_oz_to_kg_factor: 32.1507466

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bb_period: 20
  bb_std: 2.0
  correlation_periods: [20, 60, 120, 252]

scores:
  weights:
    technical: 0.25
    macro: 0.20
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.10
    analogue: 0.10
    model: 0.10

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  analogue_min_sample: 10
  analogue_top_k: 20

backtest:
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  slippage_bps: 5.0
  max_position_size: 0.25

alerts:
  price_jump_pct: 3.5
  rsi_overbought: 70
  rsi_oversold: 30
  ratio_zscore_extreme: 2.0
