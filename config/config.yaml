system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  default_provider: "yfinance"

ingestion:
  default_lookback_days: 1825  # 5 years of historical data
  max_retries: 3
  backoff_factor: 2.0
  timeout_seconds: 30
  rate_limit_delay_seconds: 0.5

validation:
  max_daily_price_jump_pct: 15.0
  allow_zero_volume: true
  classified_levels: ["valid", "suspicious", "invalid"]

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std_dev: 2.0
  correlation_windows: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  models:
    - "historical_analogue"
    - "linear_regression"
    - "logistic_regression"
    - "random_forest"
    - "gradient_boosting"

scoring:
  weights:
    technical: 0.20
    macro: 0.20
    momentum: 0.15
    volatility: 0.15
    relative_value: 0.15
    historical_pattern: 0.15

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  gold_silver_ratio_high: 90
  gold_silver_ratio_low: 65
  price_jump_pct: 3.0
  dxy_move_pct: 1.5

backtesting:
  transaction_cost_pct: 0.0010  # 10 bps
  slippage_pct: 0.0005          # 5 bps
  initial_capital: 100000.0
