system:
  timezone: "Asia/Kolkata"
  log_level: "INFO"
  default_data_provider: "yahoo"
  historical_lookback_days: 2520

conversion:
  troy_oz_to_grams: 31.1034768
  gold_inr_unit_grams: 10.0
  silver_inr_unit_grams: 1000.0

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr_period: 14
  bollinger:
    period: 20
    std_dev: 2
  volatility_lookbacks: [20, 60, 120, 252]
  correlation_lookbacks: [20, 60, 120, 252]

scores:
  weights:
    technical: 0.25
    macro: 0.20
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.15
    historical_pattern: 0.15

forecast:
  horizons: [1, 3, 5, 10, 20, 60]

alerts:
  thresholds:
    rsi_overbought: 70
    rsi_oversold: 30
    price_change_pct_1d: 2.0
    ratio_zscore_extreme: 2.0
    dxy_change_pct_1d: 1.0
    yield_change_bps_1d: 10.0

backtest:
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  slippage_bps: 5.0

paths:
  raw: "data/raw"
  processed: "data/processed"
  features: "data/features"
  analysis: "data/analysis"
  predictions: "data/predictions"
  models: "data/models"
  quality: "data/quality"
  reports: "reports/daily"
  backtests: "data/backtests"
