system:
  timezone: "UTC"
  indian_timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  default_lookback_years: 5

providers:
  primary: "yfinance"
  timeout_seconds: 15
  max_retries: 3
  backoff_factor: 2.0

indicators:
  sma_windows: [5, 10, 20, 50, 100, 200]
  ema_windows: [9, 20, 50, 200]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0

correlations:
  windows: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  analogue_top_k: 15

score_weights:
  technical: 0.25
  macro: 0.25
  momentum: 0.15
  volatility: 0.10
  relative_value: 0.15
  historical_pattern: 0.10

backtest:
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  slippage_bps: 5.0

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  ratio_zscore_extreme: 2.0
  price_change_threshold_pct: 2.5
