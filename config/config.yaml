system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  log_level: "INFO"

providers:
  default: "yfinance"
  timeout_seconds: 15
  max_retries: 3
  backoff_factor: 2.0

data:
  historical_lookback_years: 10
  fill_missing_business_days: true

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr_period: 14
  bollinger_bands:
    period: 20
    std_dev: 2.0
  roc_period: 12
  volatility_lookbacks: [20, 60, 252]

analysis:
  gold_silver_ratio:
    rolling_windows: [20, 60, 252]
    zscore_window: 252
    extreme_percentile_low: 5.0
    extreme_percentile_high: 95.0
  correlation_windows: [20, 60, 120, 252]
  forecast_horizons: [1, 3, 5, 10, 20, 60]

scoring:
  weights:
    technical: 0.25
    macro: 0.25
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.15
    pattern: 0.10

alert_thresholds:
  price_change_pct_1d: 2.0
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  volatility_spike_zscore: 2.0
  gold_silver_ratio_zscore_extreme: 2.0
  yield_change_bp_1d: 10.0

backtesting:
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  slippage_bps: 5.0
  max_position_size: 0.20
