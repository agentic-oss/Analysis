system:
  timezone: "Asia/Kolkata"
  log_level: "INFO"
  data_dir: "data"
  reports_dir: "reports"

data_provider:
  primary: "yfinance"
  timeout_seconds: 15
  max_retries: 3
  backoff_factor: 2.0

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  atr_period: 14
  volatility_periods: [20, 60]

correlations:
  lookback_windows: [20, 60, 120, 252]

forecasting:
  horizons_days: [1, 3, 5, 10, 20, 60]
  analogue_top_k: 15
  analogue_min_similarity: 0.70

scoring:
  weights:
    technical: 0.25
    macro: 0.20
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.15
    historical_pattern: 0.15

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  gold_silver_ratio_high: 85
  gold_silver_ratio_low: 65
  daily_move_threshold_pct: 2.0
  dxy_move_threshold_pct: 1.0

backtest:
  initial_capital: 100000.0
  transaction_cost_pct: 0.0005
  slippage_pct: 0.0005
