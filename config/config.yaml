system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  default_provider: "yahoo"
  collection_time_utc: "18:00"

technical_indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  correlation_periods: [20, 60, 120, 252]

analogue_engine:
  min_historical_samples: 5
  top_k_analogues: 10
  feature_weights:
    rsi: 1.5
    macd: 1.0
    sma_20_dist: 1.2
    volatility: 1.2
    gold_silver_ratio: 1.5
    dxy_return: 1.0
    us10y_change: 1.0
    vix: 0.8

scoring:
  weights:
    technical: 0.25
    macro: 0.25
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.15
    historical_pattern: 0.10

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  confidence_threshold: 60.0

backtesting:
  transaction_cost_bps: 5.0
  slippage_bps: 2.0
  initial_capital: 100000.0

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  price_change_threshold_pct: 2.5
  gsr_extreme_zscore: 2.0
