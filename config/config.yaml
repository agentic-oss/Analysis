system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  default_provider: "yfinance"

conversions:
  oz_to_grams: 31.1034768
  kg_to_grams: 1000.0
  ten_g_to_grams: 10.0

ingestion:
  retries: 3
  timeout: 10
  backoff_factor: 1.5

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  volatility_periods: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  similarity_top_k: 25

scoring_weights:
  technical: 0.20
  macro: 0.20
  momentum: 0.15
  volatility: 0.15
  relative_value: 0.15
  historical_pattern: 0.15

alert_thresholds:
  rsi_overbought: 70
  rsi_oversold: 30
  gold_silver_ratio_extreme_high: 90.0
  gold_silver_ratio_extreme_low: 65.0
  daily_price_change_threshold_pct: 2.5
