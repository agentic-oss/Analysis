system:
  project_name: "gold_silver_pipeline"
  environment: "production"
  timezone: "Asia/Kolkata"
  collection_time_utc: "20:00"

data_paths:
  raw: "data/raw"
  processed: "data/processed"
  features: "data/features"
  macro: "data/macro"
  events: "data/events"
  analysis: "data/analysis"
  predictions: "data/predictions"
  models: "data/models"
  backtests: "data/backtests"
  quality: "data/quality"
  reports: "reports/daily"

data_provider:
  primary: "yfinance"
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 2.0

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std_dev: 2.0
  rolling_volatility_periods: [20, 60]
  correlation_periods: [20, 60, 120, 252]

ratios:
  gold_silver_ratio:
    lookback_window: 252
    extreme_zscore_threshold: 2.0

scoring_weights:
  technical: 0.25
  macro: 0.20
  momentum: 0.15
  volatility: 0.10
  relative_value: 0.15
  historical_pattern: 0.15

forecast_horizons: [1, 3, 5, 10, 20, 60]

alert_thresholds:
  rsi_overbought: 70
  rsi_oversold: 30
  dxy_daily_change_pct: 1.0
  us10y_daily_bps: 10.0
  ratio_zscore_extreme: 2.0

backtest:
  initial_capital: 100000.0
  transaction_cost_pct: 0.0005
  slippage_pct: 0.0005
  default_position_size_pct: 1.0
