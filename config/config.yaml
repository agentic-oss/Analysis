system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  default_provider: "yfinance"

ingestion:
  lookback_days: 365
  retry_attempts: 3
  retry_backoff_sec: 2
  timeout_sec: 15

conversions:
  oz_to_grams: 31.1034768
  grams_per_10g: 10.0
  grams_per_kg: 1000.0
  custom_duty_gold_pct: 0.06
  custom_duty_silver_pct: 0.06

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  rolling_vol_periods: [20, 60, 120, 252]
  correlation_periods: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  analogue_top_k: 15
  min_analogue_samples: 5

scoring_weights:
  technical: 0.25
  macro: 0.25
  momentum: 0.15
  volatility: 0.10
  relative_value: 0.10
  historical_pattern: 0.10
  model: 0.05

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  gold_silver_ratio_high: 85
  gold_silver_ratio_low: 65
  price_change_1d_pct_extreme: 2.5
  yield_change_1d_bp_extreme: 15

backtesting:
  initial_capital: 100000.0
  transaction_cost_bps: 10.0
  slippage_bps: 5.0

reporting:
  generate_markdown: true
  generate_json: true
