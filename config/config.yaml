system:
  data_dir: "data"
  reports_dir: "reports"
  timezone: "Asia/Kolkata"
  collection_time_utc: "20:00"

storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  features_dir: "data/features"
  macro_dir: "data/macro"
  events_dir: "data/events"
  analysis_dir: "data/analysis"
  predictions_dir: "data/predictions"
  models_dir: "data/models"
  backtests_dir: "data/backtests"
  quality_dir: "data/quality"

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  correlation_windows: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  analogue_top_k: 25
  analogue_min_sample: 10

scores:
  weights:
    technical: 0.25
    macro: 0.20
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.10
    historical_pattern: 0.10
    model: 0.10

backtest:
  initial_capital: 100000.0
  transaction_cost_pct: 0.0005 # 5 bps
  slippage_pct: 0.0002 # 2 bps
  risk_free_rate: 0.04 # 4%

alerts:
  thresholds:
    rsi_overbought: 70
    rsi_oversold: 30
    price_jump_pct: 3.0
    gold_silver_ratio_zscore: 2.0
    yield_change_bp: 15
    dxy_jump_pct: 1.0
