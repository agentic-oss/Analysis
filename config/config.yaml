system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  log_level: "INFO"
  default_lookback_days: 1095  # 3 years
  collection_time_utc: "22:00" # Post US close / Indian market close

conversions:
  troz_to_grams: 31.1034768
  grams_per_10g: 10.0
  grams_per_kg: 1000.0

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr_period: 14
  bollinger_bands:
    period: 20
    std_dev: 2.0
  volume_sma_period: 20
  rolling_volatility_period: 20

regimes:
  correlation_windows: [20, 60, 120, 252]
  gold_silver_ratio:
    extreme_high_zscore: 2.0
    extreme_low_zscore: -2.0
  macro:
    dxy_bullish_threshold: 0.02
    vix_high_threshold: 22.0
    vix_low_threshold: 14.0

analogues:
  top_n: 10
  lookback_window_days: 5
  similarity_weights:
    rsi: 0.15
    macd: 0.15
    sma_distance: 0.20
    volatility: 0.15
    gold_silver_ratio: 0.15
    macro: 0.20

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  models:
    - "historical_analogue"
    - "logistic_regression"
    - "random_forest"
    - "gradient_boosting"

backtest:
  initial_capital: 100000.0
  transaction_cost_pct: 0.0005  # 5 bps
  slippage_pct: 0.0005          # 5 bps
  risk_free_rate: 0.04

alerts:
  price_change_pct_1d: 0.025     # 2.5% move
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  ratio_zscore_extreme: 2.0
  yield_change_bp: 15.0          # 15 bps
