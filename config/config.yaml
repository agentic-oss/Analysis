system:
  timezone: "UTC"
  default_currency: "USD"
  indian_currency: "INR"
  data_provider: "yahoo"
  max_retries: 3
  retry_backoff: 2

indicators:
  sma_windows: [5, 10, 20, 50, 100, 200]
  ema_windows: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  correlation_windows: [20, 60, 120, 252]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  similarity_threshold: 0.7
  analogue_top_k: 20

backtesting:
  initial_capital: 100000
  transaction_cost_bps: 10
  slippage_bps: 5

scoring:
  technical_weight: 0.25
  macro_weight: 0.25
  momentum_weight: 0.15
  volatility_weight: 0.10
  relative_value_weight: 0.15
  pattern_weight: 0.10

alert_thresholds:
  rsi_overbought: 70
  rsi_oversold: 30
  price_jump_pct: 3.5
  gs_ratio_extreme_high: 85
  gs_ratio_extreme_low: 65
