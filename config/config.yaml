system:
  timezone: "Asia/Kolkata"
  data_dir: "data"
  reports_dir: "reports"
  log_level: "INFO"

providers:
  primary: "yfinance"
  timeout_seconds: 15
  max_retries: 3
  backoff_factor: 1.5

ingestion:
  start_date: "2015-01-01"
  fill_missing: true

indicators:
  sma_periods: [5, 10, 20, 50, 100, 200]
  ema_periods: [9, 20, 50, 200]
  rsi_period: 14
  stoch_rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  correlations:
    windows: [20, 60, 120, 252]

scoring:
  weights:
    technical: 0.25
    macro: 0.25
    momentum: 0.15
    volatility: 0.10
    relative_value: 0.10
    pattern: 0.10
    model: 0.05

analogue:
  similarity_threshold: 0.85
  max_analogues: 15
  lookback_days: 252
  forward_horizons: [1, 3, 5, 10, 20, 60]

forecasting:
  horizons: [1, 3, 5, 10, 20, 60]
  confidence_threshold: 0.60

backtesting:
  initial_capital: 100000.0
  transaction_cost_pct: 0.0005
  slippage_pct: 0.0005
  position_sizing: "equal_weight"

alerts:
  rsi_overbought: 70
  rsi_oversold: 30
  price_change_large_pct: 2.0
  gold_silver_ratio_extreme_high: 90
  gold_silver_ratio_extreme_low: 65
  vix_spike: 25.0
