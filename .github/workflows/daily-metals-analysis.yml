name: Daily Precious Metals Analysis Pipeline

on:
  schedule:
    # Run at 12:30 UTC (18:00 IST) every weekday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Execute Daily Pipeline
        run: |
          TARGET_DATE=$(date +%Y-%m-%d)
          echo "Executing pipeline for date: $TARGET_DATE"
          PYTHONPATH=. python3 src/pipeline/runner.py "$TARGET_DATE"

      - name: Verify Secret Protection
        run: |
          echo "Scanning for exposed secrets or API credentials..."
          git status
          ! grep -rn "sk-[a-zA-Z0-9]\{32,\}" . || (echo "Exposed secret detected!" && exit 1)

      - name: Commit and Push Daily Research Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ reports/
          if git status --porcelain | grep -E "(data/|reports/)"; then
            CURRENT_DATE=$(date +%Y-%m-%d)
            git commit -m "data: daily gold silver analysis $CURRENT_DATE"
            git push
          else
            echo "No data changes to commit."
          fi
