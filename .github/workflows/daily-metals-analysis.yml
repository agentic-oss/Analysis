name: Daily Precious Metals Analysis Pipeline

on:
  schedule:
    # Run daily at 18:00 UTC (11:30 PM IST / market close)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      execution_date:
        description: 'Execution date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Pipeline
        env:
          EXEC_DATE: ${{ github.event.inputs.execution_date }}
        run: |
          if [ -n "$EXEC_DATE" ]; then
            PYTHONPATH=. python3 src/pipeline/runner.py "$EXEC_DATE"
          else
            PYTHONPATH=. python3 src/pipeline/runner.py
          fi

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Verify Secret Protection
        run: |
          echo "Scanning for hardcoded API keys or secrets in repository..."
          ! grep -rnI --exclude-dir=".git" --exclude-dir=".github" -E "api_key|password|secret|bearer" src/ config/ || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No data or report changes to commit."
          else
            git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')"
            git push
          fi
