name: Daily Precious Metals Analysis Pipeline

on:
  schedule:
    # Run daily at 18:30 UTC / 00:00 IST (Indian Market Close alignment)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      execution_date:
        description: 'Target Execution Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Execute Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.execution_date }}" ]; then
            PYTHONPATH=. python3 src/pipeline/runner.py "${{ github.event.inputs.execution_date }}"
          else
            PYTHONPATH=. python3 src/pipeline/runner.py
          fi

      - name: Verify Secret Protection
        run: |
          # Ensure no API keys or .env files containing secrets are tracked or staged
          if git status --porcelain | grep -E '\.env$|secret|token|password'; then
            echo "Error: Unsafe file or secret detected in status!"
            exit 1
          fi

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')" && git push)
