name: Daily Precious Metals Analysis Pipeline

on:
  schedule:
    # Run at 22:00 UTC Monday-Friday (corresponding to Indian Market / US Market Close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Execute Daily Precious Metals Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py

      - name: Verify Secret Protection
        run: |
          echo "Checking for leaked secrets or keys..."
          git diff | grep -iE "(api_key|secret|password|bearer|private_key)" && exit 1 || echo "No secrets found in diff."

      - name: Commit and Push Daily Analysis Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git status -s | grep -E "(data/|reports/)"; then
            CURRENT_DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: daily gold silver analysis ${CURRENT_DATE}"
            git push
          else
            echo "No changes to commit."
          fi
