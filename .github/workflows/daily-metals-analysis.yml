name: Daily Precious Metals Analysis

on:
  schedule:
    # Run daily at 17:30 UTC / 23:00 IST (after global & Indian markets close)
    - cron: '30 17 * * 1-5'
  workflow_dispatch:

jobs:
  run-metals-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run automated test suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Daily Precious Metals Research Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py

      - name: Verify no secrets in repository
        run: |
          ! grep -rn "sk-" . --exclude-dir=.git

      - name: Commit & Push Daily Analysis Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')" || exit 0
          git push || true
