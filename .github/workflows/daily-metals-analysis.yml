name: Daily Precious Metals Research Pipeline

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (02:30 IST) after market close
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Pipeline
        env:
          PYTHONPATH: .
        run: |
          python src/pipeline/runner.py

      - name: Run Test Suite
        run: |
          pytest

      - name: Verify Secret Protection
        run: |
          # Verify no secrets or credentials are present in output files
          grep -rn "API_KEY\|SECRET\|PASSWORD" data/ reports/ || true

      - name: Commit & Push Daily Analysis Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ reports/

          # Only commit if changes exist
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')"
            git push
          fi
