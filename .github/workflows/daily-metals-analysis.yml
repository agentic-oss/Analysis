name: Daily Precious Metals Research Pipeline

on:
  schedule:
    # Runs daily at 18:00 UTC (23:30 IST), aligned with market close
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Pipeline Automated Tests
        run: |
          PYTHONPATH=. pytest

      - name: Execute Daily Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py $(date +%Y-%m-%d)

      - name: Verify Secret Security
        run: |
          echo "Verifying no private secrets or credentials exist in outputs..."
          ! grep -rnI "API_KEY\|SECRET\|PASSWORD" data/ reports/ || exit 1

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: daily gold silver analysis $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push || echo "Push skipped or unpermitted"
