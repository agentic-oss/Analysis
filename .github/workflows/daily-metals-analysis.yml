name: Daily Gold & Silver Analysis Pipeline

on:
  schedule:
    # Run daily at 00:00 UTC / 05:30 IST
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Set Target Date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.target_date }}" >> $GITHUB_ENV
          else
            echo "TARGET_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV
          fi

      - name: Run Gold & Silver Analysis Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py $TARGET_DATE --mock

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest

      - name: Verify Secret Safety
        run: |
          echo "Verifying no API keys or secrets in environment or files..."
          git diff --cached | grep -iE 'api[_-]?key|secret|password|token' && exit 1 || echo "No secrets detected."

      - name: Commit and Push Daily Analysis Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: daily gold silver analysis $TARGET_DATE" || echo "No changes to commit"
          git push || echo "Push skipped due to permissions or no remote updates"
