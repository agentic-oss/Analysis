name: Daily Precious Metals Analysis Pipeline

on:
  schedule:
    # Run daily at 18:30 UTC / 00:00 IST (Indian Market aware schedule)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py $(date +'%Y-%m-%d')

      - name: Run test suite
        run: |
          pytest

      - name: Verify no secrets are committed
        run: |
          if grep -rn "API_KEY\|SECRET\|PASSWORD" config/ data/ reports/; then
            echo "Secrets detected!"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push || echo "Push failed or not permitted"
