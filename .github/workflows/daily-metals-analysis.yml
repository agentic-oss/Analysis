name: Daily Precious Metals Research Pipeline

on:
  schedule:
    # Run daily at 18:00 UTC (11:30 PM IST / Post US Market Close)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      analysis_date:
        description: 'Analysis date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Verify no secrets in code
        run: |
          ! grep -rn "AKIA[0-9A-Z]\{16\}" src/ config/ || exit 1
          ! grep -rn "BEGIN PRIVATE KEY" src/ config/ || exit 1

      - name: Run automated tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Determine execution date
        id: get-date
        run: |
          if [ -n "${{ github.event.inputs.analysis_date }}" ]; then
            echo "RUN_DATE=${{ github.event.inputs.analysis_date }}" >> $GITHUB_ENV
          else
            echo "RUN_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV
          fi

      - name: Run Daily Precious Metals Research Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/runner.py $RUN_DATE

      - name: Commit and push daily research updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/ reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: daily gold silver research update $RUN_DATE" && git push)
