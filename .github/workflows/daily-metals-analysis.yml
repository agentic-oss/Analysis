name: Daily Precious Metals Market Analysis & Forecasting Pipeline

on:
  schedule:
    # Run daily at 18:00 UTC (11:30 PM IST), covering global & Indian market close
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target execution date (YYYY-MM-DD)'
        required: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System and Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml pyarrow yfinance pytest

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest

      - name: Execute Daily Metals Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            PYTHONPATH=. python3 src/pipeline/runner.py ${{ github.event.inputs.target_date }}
          else
            PYTHONPATH=. python3 src/pipeline/runner.py
          fi

      - name: Verify Secret & Credential Protection
        run: |
          echo "Verifying no API keys or secrets present in staged environment..."
          ! git diff | grep -iE 'api[_-]?key|password|secret|token' || exit 1

      - name: Commit and Push Updated Research Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: daily gold silver analysis $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
